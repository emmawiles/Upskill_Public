<title id="t73347">Effect of AI on task performance, relative to data scientists</title><desc id="d84086">Grouped horizontal bar chart. For coding, statistics and prediction tasks, the control and treatment group mean scores are shown relative to the data-scientist benchmark at zero. Coding: control -0.63, treatment -0.14, a 49 percentage-point gain. Statistics: control -0.32, treatment -0.12, a 20-point gain. Prediction: control -0.43, treatment -0.26, a 17-point gain. All treatment groups remain below the benchmark.</desc><line x1="150.0" y1="70" x2="150.0" y2="375" class="grid"/><text x="150.0" y="395" text-anchor="middle" class="muted" font-size="12">-1</text><line x1="262.9" y1="70" x2="262.9" y2="375" class="grid"/><text x="262.9" y="395" text-anchor="middle" class="muted" font-size="12">-0.75</text><line x1="375.7" y1="70" x2="375.7" y2="375" class="grid"/><text x="375.7" y="395" text-anchor="middle" class="muted" font-size="12">-0.5</text><line x1="488.6" y1="70" x2="488.6" y2="375" class="grid"/><text x="488.6" y="395" text-anchor="middle" class="muted" font-size="12">-0.25</text><line x1="601.4" y1="70" x2="601.4" y2="375" class="bench"/><text x="601.4" y="395" text-anchor="middle" class="muted" font-size="12">0</text><text x="601.4" y="42" text-anchor="middle" class="ink" font-size="12" font-weight="600">Data scientists</text><text x="601.4" y="56" text-anchor="middle" class="muted" font-size="11">benchmark = 0</text><rect x="150" y="21" width="13" height="13" rx="2" class="bar-control bar-stroke"/><text x="168" y="32" class="ink" font-size="13">Control</text><rect x="233.2" y="21" width="13" height="13" rx="2" class="bar-treatment bar-stroke"/><text x="251.2" y="32" class="ink" font-size="13">Treatment</text><text x="138" y="121.83333333333334" text-anchor="end" class="ink" font-size="14" font-weight="600">Coding</text><text x="615.4" y="118.8" text-anchor="start" font-size="14" font-weight="700" class="bar-treatment">+49 pts</text><text x="615.4" y="133.8" text-anchor="start" class="muted" font-size="10">gain vs. control</text><rect x="317.5" y="98.8" width="283.9" height="20" class="bar-control bar-stroke"/><text x="311.5" y="113.8" text-anchor="end" class="val" font-size="11.5">-0.63</text><rect x="538.2" y="122.8" width="63.2" height="20" class="bar-treatment bar-stroke"/><text x="532.2" y="137.8" text-anchor="end" class="val" font-size="11.5">-0.14</text><text x="138" y="223.50000000000003" text-anchor="end" class="ink" font-size="14" font-weight="600">Statistics</text><text x="615.4" y="220.5" text-anchor="start" font-size="14" font-weight="700" class="bar-treatment">+20 pts</text><text x="615.4" y="235.5" text-anchor="start" class="muted" font-size="10">gain vs. control</text><rect x="455.6" y="200.5" width="145.8" height="20" class="bar-control bar-stroke"/><text x="449.6" y="215.5" text-anchor="end" class="val" font-size="11.5">-0.32</text><rect x="545.9" y="224.5" width="55.5" height="20" class="bar-treatment bar-stroke"/><text x="539.9" y="239.5" text-anchor="end" class="val" font-size="11.5">-0.12</text><text x="138" y="325.1666666666667" text-anchor="end" class="ink" font-size="14" font-weight="600">Prediction</text><text x="615.4" y="322.2" text-anchor="start" font-size="14" font-weight="700" class="bar-treatment">+17 pts</text><text x="615.4" y="337.2" text-anchor="start" class="muted" font-size="10">gain vs. control</text><rect x="406.4" y="302.2" width="195.0" height="20" class="bar-control bar-stroke"/><text x="400.4" y="317.2" text-anchor="end" class="val" font-size="11.5">-0.43</text><rect x="484.1" y="326.2" width="117.4" height="20" class="bar-treatment bar-stroke"/><text x="478.1" y="341.2" text-anchor="end" class="val" font-size="11.5">-0.26</text><text x="387.0" y="422" text-anchor="middle" class="muted" font-size="12.5">Performance relative to data scientists (0 = benchmark, −1 = no points)</text></svg>
