<svg class="chart" viewBox="0 0 720 520" width="100%" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="t47955 d68145">
  <style>
    .chart { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1b1b1a; }
    .muted { fill: #6b6b64; }
