<title id="t47955">Effect of AI experience on predictions about GPT-4's abilities</title><desc id="d68145">Dot-and-interval chart of the treatment effect, in percentage points, on workers' confidence that GPT-4 can answer each of seven questions, measured after the experiment. Filled dots mark questions GPT-4 cannot answer; open dots mark questions it can. For all four questions GPT-4 cannot answer, treated workers were significantly more confident it could, indicating worse calibration.</desc><line x1="335.5" y1="64" x2="335.5" y2="468" class="grid"/><text x="335.5" y="488" text-anchor="middle" class="muted" font-size="12">-5</text><line x1="412.7" y1="64" x2="412.7" y2="468" class="bench"/><text x="412.7" y="488" text-anchor="middle" class="muted" font-size="12">+0</text><line x1="490.0" y1="64" x2="490.0" y2="468" class="grid"/><text x="490.0" y="488" text-anchor="middle" class="muted" font-size="12">+5</text><line x1="567.3" y1="64" x2="567.3" y2="468" class="grid"/><text x="567.3" y="488" text-anchor="middle" class="muted" font-size="12">+10</text><line x1="644.5" y1="64" x2="644.5" y2="468" class="grid"/><text x="644.5" y="488" text-anchor="middle" class="muted" font-size="12">+15</text><circle cx="320" cy="32" r="6" class="dot-fill"/><text x="332" y="36" class="ink" font-size="12.5">GPT-4 cannot answer</text><circle cx="490" cy="32" r="6" class="dot-open"/><text x="502" y="36" class="ink" font-size="12.5">GPT-4 can answer</text><text x="306" y="84.9" text-anchor="end" class="ink" font-size="11.5">Q1. Build a rotating US flag in</text><text x="306" y="98.9" text-anchor="end" class="ink" font-size="11.5">HTML/JavaScript canvas</text><line x1="374.1" y1="92.9" x2="494.6" y2="92.9" class="err"/><line x1="374.1" y1="88.9" x2="374.1" y2="96.9" class="err"/><line x1="494.6" y1="88.9" x2="494.6" y2="96.9" class="err"/><circle cx="434.4" cy="92.9" r="6" class="dot-open"/><text x="502.6" y="96.9" class="val" font-size="11">+1.4</text><text x="306" y="142.6" text-anchor="end" class="ink" font-size="11.5">Q2. Which cities have an even-numbered</text><text x="306" y="156.6" text-anchor="end" class="ink" font-size="11.5">population?</text><line x1="434.4" y1="150.6" x2="576.5" y2="150.6" class="err"/><line x1="434.4" y1="146.6" x2="434.4" y2="154.6" class="err"/><line x1="576.5" y1="146.6" x2="576.5" y2="154.6" class="err"/><circle cx="505.5" cy="150.6" r="6" class="dot-fill"/><text x="584.5" y="154.6" class="val" font-size="11">+6.0 *</text><text x="306" y="200.3" text-anchor="end" class="ink" font-size="11.5">Q3. Split a $10 bill evenly across</text><text x="306" y="214.3" text-anchor="end" class="ink" font-size="11.5">items with different prices</text><line x1="425.1" y1="208.3" x2="571.9" y2="208.3" class="err"/><line x1="425.1" y1="204.3" x2="425.1" y2="212.3" class="err"/><line x1="571.9" y1="204.3" x2="571.9" y2="212.3" class="err"/><circle cx="499.3" cy="208.3" r="6" class="dot-fill"/><text x="579.9" y="212.3" class="val" font-size="11">+5.6 *</text><text x="306" y="265.0" text-anchor="end" class="ink" font-size="11.5">Q4. Help with crossword clues</text><line x1="440.5" y1="266.0" x2="578.1" y2="266.0" class="err"/><line x1="440.5" y1="262.0" x2="440.5" y2="270.0" class="err"/><line x1="578.1" y1="262.0" x2="578.1" y2="270.0" class="err"/><circle cx="510.1" cy="266.0" r="6" class="dot-open"/><text x="586.1" y="270.0" class="val" font-size="11">+6.3 *</text><text x="306" y="315.7" text-anchor="end" class="ink" font-size="11.5">Q5. Who lost the Super Bowl two years</text><text x="306" y="329.7" text-anchor="end" class="ink" font-size="11.5">after Pan-Am's bankruptcy?</text><line x1="346.3" y1="323.7" x2="488.5" y2="323.7" class="err"/><line x1="346.3" y1="319.7" x2="346.3" y2="327.7" class="err"/><line x1="488.5" y1="319.7" x2="488.5" y2="327.7" class="err"/><circle cx="417.4" cy="323.7" r="6" class="dot-open"/><text x="496.5" y="327.7" class="val" font-size="11">+0.3</text><text x="306" y="373.4" text-anchor="end" class="ink" font-size="11.5">Q6. Write the word “hello” as ASCII</text><text x="306" y="387.4" text-anchor="end" class="ink" font-size="11.5">art with # and _</text><line x1="486.9" y1="381.4" x2="636.8" y2="381.4" class="err"/><line x1="486.9" y1="377.4" x2="486.9" y2="385.4" class="err"/><line x1="636.8" y1="377.4" x2="636.8" y2="385.4" class="err"/><circle cx="561.1" cy="381.4" r="6" class="dot-fill"/><text x="644.8" y="385.4" class="val" font-size="11">+9.6 *</text><text x="306" y="431.1" text-anchor="end" class="ink" font-size="11.5">Q7. Best next move for O in a game of</text><text x="306" y="445.1" text-anchor="end" class="ink" font-size="11.5">tic-tac-toe</text><line x1="417.4" y1="439.1" x2="573.5" y2="439.1" class="err"/><line x1="417.4" y1="435.1" x2="417.4" y2="443.1" class="err"/><line x1="573.5" y1="435.1" x2="573.5" y2="443.1" class="err"/><circle cx="496.2" cy="439.1" r="6" class="dot-fill"/><text x="581.5" y="443.1" class="val" font-size="11">+5.4 *</text><text x="490.0" y="514" text-anchor="middle" class="muted" font-size="12.5">Treatment effect on confidence GPT-4 can answer (percentage points)</text></svg>
