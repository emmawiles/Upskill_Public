<title id="t42548">Post-experiment technical knowledge without ChatGPT</title><desc id="d32107">Grouped horizontal bars showing the share of control and treatment workers answering five technical questions correctly, without ChatGPT. The two groups perform similarly on every question; no difference is statistically significant and a joint test finds no effect (F(5,198)=0.83, p=0.531).</desc><line x1="300.0" y1="60" x2="300.0" y2="470" class="grid"/><text x="300.0" y="490" text-anchor="middle" class="muted" font-size="12">0.00</text><line x1="387.5" y1="60" x2="387.5" y2="470" class="grid"/><text x="387.5" y="490" text-anchor="middle" class="muted" font-size="12">0.25</text><line x1="475.0" y1="60" x2="475.0" y2="470" class="grid"/><text x="475.0" y="490" text-anchor="middle" class="muted" font-size="12">0.50</text><line x1="562.5" y1="60" x2="562.5" y2="470" class="grid"/><text x="562.5" y="490" text-anchor="middle" class="muted" font-size="12">0.75</text><line x1="650.0" y1="60" x2="650.0" y2="470" class="grid"/><text x="650.0" y="490" text-anchor="middle" class="muted" font-size="12">1.00</text><line x1="300.0" y1="60" x2="300.0" y2="470" class="axis"/><rect x="300" y="21" width="13" height="13" rx="2" class="bar-control bar-stroke"/><text x="318" y="32" class="ink" font-size="13">Control</text><rect x="383.2" y="21" width="13" height="13" rx="2" class="bar-treatment bar-stroke"/><text x="401.2" y="32" class="ink" font-size="13">Treatment</text><text x="288" y="90.0" text-anchor="end" class="ink" font-size="12">Filtering rows in Python (select</text><text x="288" y="104.0" text-anchor="end" class="ink" font-size="12">all)</text><rect x="300.0" y="83.0" width="122.5" height="16" class="bar-control bar-stroke"/><text x="428.5" y="95.0" class="val" font-size="11">0.35</text><rect x="300.0" y="103.0" width="126.0" height="16" class="bar-treatment bar-stroke"/><text x="432.0" y="115.0" class="val" font-size="11">0.36</text><text x="288" y="172.0" text-anchor="end" class="ink" font-size="12">Probability of 3 heads in 3 coin</text><text x="288" y="186.0" text-anchor="end" class="ink" font-size="12">tosses (multiple choice)</text><rect x="300.0" y="165.0" width="318.5" height="16" class="bar-control bar-stroke"/><text x="624.5" y="177.0" class="val" font-size="11">0.91</text><rect x="300.0" y="185.0" width="329.0" height="16" class="bar-treatment bar-stroke"/><text x="635.0" y="197.0" class="val" font-size="11">0.94</text><text x="288" y="254.0" text-anchor="end" class="ink" font-size="12">Distance-based algorithms and</text><text x="288" y="268.0" text-anchor="end" class="ink" font-size="12">scaling (true/false)</text><rect x="300.0" y="247.0" width="255.5" height="16" class="bar-control bar-stroke"/><text x="561.5" y="259.0" class="val" font-size="11">0.73</text><rect x="300.0" y="267.0" width="273.0" height="16" class="bar-treatment bar-stroke"/><text x="579.0" y="279.0" class="val" font-size="11">0.78</text><text x="288" y="336.0" text-anchor="end" class="ink" font-size="12">Techniques for handling missing</text><text x="288" y="350.0" text-anchor="end" class="ink" font-size="12">categorical data (select all)</text><rect x="300.0" y="329.0" width="280.0" height="16" class="bar-control bar-stroke"/><text x="586.0" y="341.0" class="val" font-size="11">0.80</text><rect x="300.0" y="349.0" width="276.5" height="16" class="bar-treatment bar-stroke"/><text x="582.5" y="361.0" class="val" font-size="11">0.79</text><text x="288" y="418.0" text-anchor="end" class="ink" font-size="12">Category of a prediction problem</text><text x="288" y="432.0" text-anchor="end" class="ink" font-size="12">(select all)</text><rect x="300.0" y="411.0" width="273.0" height="16" class="bar-control bar-stroke"/><text x="579.0" y="423.0" class="val" font-size="11">0.78</text><rect x="300.0" y="431.0" width="245.0" height="16" class="bar-treatment bar-stroke"/><text x="551.0" y="443.0" class="val" font-size="11">0.70</text><text x="475.0" y="514" text-anchor="